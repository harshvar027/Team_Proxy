<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <title>Choose a new password · Baari</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/motion.js"></script>
  <script type="module" src="js/change-password.js"></script>
</head>
<body class="login-page">
  <a class="skip-link" href="#pw-card" data-i18n="skip">Skip to content</a>
  <div class="login-blobs" aria-hidden="true">
    <div class="blob login-blob-1"></div>
    <div class="blob login-blob-2"></div>
  </div>
  <main id="pw-card" class="login-card" data-enter>
    <div class="login-header">
      <img class="brand-logo brand-logo-lg" src="assets/logo.png" alt="Baari">
      <h1 class="title-1" data-i18n="changePassword.title">Choose a new password</h1>
      <p class="muted" data-i18n="changePassword.subtitle">You’ll use this the next time you sign in.</p>
    </div>
    <form class="login-form" id="pw-form" novalidate>
      <div class="field">
        <div class="field-control">
          <input class="field-input" id="current" name="current" type="password" autocomplete="current-password" placeholder=" " required>
          <label class="field-label" for="current" data-i18n="changePassword.current">Current password</label>
        </div>
      </div>
      <div class="field">
        <div class="field-control">
          <input class="field-input" id="next" name="next" type="password" autocomplete="new-password" placeholder=" " required>
          <label class="field-label" for="next" data-i18n="changePassword.next">New password</label>
        </div>
      </div>
      <div class="strength-meter" aria-live="polite">
        <div class="strength-track"><div class="strength-bar" id="strength-bar"></div></div>
        <ul class="strength-checklist">
          <li class="strength-item" data-check="length" data-i18n="changePassword.length">At least 8 characters</li>
          <li class="strength-item" data-check="number" data-i18n="changePassword.number">A number</li>
          <li class="strength-item" data-check="upper" data-i18n="changePassword.upper">An uppercase letter</li>
          <li class="strength-item" data-check="special" data-i18n="changePassword.special">A special character</li>
        </ul>
      </div>
      <div class="field">
        <div class="field-control">
          <input class="field-input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder=" " required>
          <label class="field-label" for="confirm" data-i18n="changePassword.confirm">Confirm password</label>
        </div>
        <p class="field-message" id="pw-message"></p>
      </div>
      <p class="login-error" id="pw-error" role="alert" aria-live="assertive"></p>
      <button class="btn btn-primary btn-lg" type="submit" id="pw-submit">
        <span class="btn-label" data-i18n="changePassword.submit">Update password</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>
  </main>
  <div class="login-toolbar">
    <div class="lang-switch" role="group" data-i18n-aria="nav.language">
      <button type="button" data-lang-btn="en">English</button>
      <button type="button" data-lang-btn="hi">हिन्दी</button>
      <button type="button" data-lang-btn="mr">मराठी</button>
    </div>
    <button class="theme-toggle" type="button" data-theme-toggle data-i18n-aria="nav.toggleTheme">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sun"></use></svg>
    </button>
  </div>
</body>
</html>
